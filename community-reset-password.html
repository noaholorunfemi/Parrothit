<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset community password | PARROTHIT</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:system-ui,sans-serif;background:#edf4ff;color:#10264b;margin:0;padding:20px}.reset-card{max-width:480px;margin:8vh auto;background:#fff;padding:clamp(18px,4vw,30px);border-radius:16px;box-shadow:0 12px 35px #0c34751a}.reset-card h1{margin-top:0}.reset-card label{display:block;font-weight:700;margin:12px 0 5px}.reset-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c8df;border-radius:8px;font:inherit}.reset-card button{margin-top:15px;background:#1769df;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.status{line-height:1.5;overflow-wrap:anywhere}.back{color:#1769df;font-weight:800}</style></head><body><main class="reset-card"><a class="back" href="interaction.html">← Back to Parrots Interaction</a><h1>Set a new password</h1><p>Use this page after opening the password recovery link sent to your email.</p><form id="resetForm"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button></form><p id="resetStatus" class="status" role="status" aria-live="polite"></p></main><script>
(()=>{'use strict';const form=document.getElementById('resetForm'),status=document.getElementById('resetStatus');let client=window.getParrothitSupabaseClient&&window.getParrothitSupabaseClient();if(!client){status.textContent='Supabase is not configured. Check supabase-config.js.';form.querySelector('button').disabled=true;return;}client.auth.getSession().then(({data,error})=>{if(error)status.textContent=error.message;else if(!data.session)status.textContent='Open the latest password recovery email link in this browser first.';});form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<8){status.textContent='Use at least 8 characters.';return;}if(p!==c){status.textContent='Passwords do not match.';return;}const b=form.querySelector('button');b.disabled=true;try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;status.textContent='Password updated. You can now return to Parrots Interaction and sign in.';form.reset();}catch(err){status.textContent=err.message||'Password could not be updated. Request a new recovery link and try again.';}finally{b.disabled=false;}});})();
</script>
<script src="js/parrothit-card-watermark.js" defer></script>
</body></html>
