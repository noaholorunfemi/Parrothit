# These two functions intentionally accept requests without a Supabase user JWT.
# The advertiser portal validates Customer ID + PIN and rate-limits failed attempts.
# Admin actions inside it verify the bearer token and active owner/admin profile.
# The payment function verifies hosted-provider callbacks and checks Admin sessions
# for legacy Admin-initiated checkouts; customer campaign initialization validates
# Customer ID + PIN and is restricted to campaign ownership.
[functions.parrothit-advertiser-portal]
verify_jwt = false

[functions.parrothit-monetization-payment]
verify_jwt = false

[functions.parrothit-video-gif-advertiser]
verify_jwt = false

# Public read-only LiveScore endpoint. Provider credentials stay server-side.
[functions.parrothit-football-public]
verify_jwt = false

# Public applicant submission is allowed without a visitor JWT. The Edge Function
# independently verifies Admin 1 and the active device session for all inbox actions.
[functions.parrothit-employment]
verify_jwt = false
# Admin-account creation requires a valid signed-in user JWT. The Edge Function
# additionally checks that the caller is the active Admin 1 (Owner) session.
[functions.parrothit-admin-create]
verify_jwt = true

