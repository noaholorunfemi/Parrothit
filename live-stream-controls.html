<!doctype html><html lang="en"><head><script>document.documentElement.classList.add('admin-auth-pending');</script><script src="../js/local-preview.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARROTHIT | Independent Live Stream Controls</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin-responsive.css?v=parrothit-v6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../js/admin-auth-guard.js"></script><style>body{background:#07190f;color:#f8fff9}.stream-admin{max-width:1180px;margin:24px auto;padding:0 16px}.stream-admin header{padding:20px;background:#0f2a1a;border:1px solid #287044;border-bottom:4px solid #27ae60;border-radius:14px}.stream-admin h1,.stream-admin h2,.stream-admin h3,.stream-admin p,.stream-admin label{color:#f8fff9}.stream-admin .intro{color:#c7f5d7}.stream-admin .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:18px}.stream-admin .slot{padding:18px;background:#0d2416;border:1px solid #28613b;border-radius:14px;min-width:0}.stream-admin input,.stream-admin select{width:100%;padding:11px;border:1px solid #477b57;border-radius:8px;background:#fafffb;color:#122318;margin:5px 0 13px;box-sizing:border-box}.stream-admin label{display:block;font-weight:800}.stream-admin .actions{display:flex;gap:8px;flex-wrap:wrap}.stream-admin button{border:0;border-radius:8px;background:#16a34a;color:white;padding:11px 14px;font-weight:900;cursor:pointer}.stream-admin button.secondary{background:#334155}.stream-admin .hint{font-size:.88rem;color:#c9d7ce}.stream-admin .status{padding:10px;background:#123b23;border-radius:8px;min-height:24px;overflow-wrap:anywhere}.stream-admin .toplinks{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.stream-admin .toplinks a{color:#fff;background:#14532d;border-radius:8px;padding:9px 12px}@media(max-width:600px){.stream-admin{padding:0 10px}.stream-admin .slot{padding:13px}}</style></head><body class="admin-auth-pending"><main class="stream-admin"><header><h1>🦜 Independent Live Stream Controls</h1><p class="intro">Each stream slot has its own URL, title, enable switch, save button, and disable button. Empty slots stay hidden on the public website.</p><div class="toplinks"><a href="control-directory.html">Control Directory</a><a href="dashboard.html">Dashboard</a><a href="../sports.html">Public Sports Page</a></div></header><p id="globalStatus" class="status" role="status">Loading saved stream settings…</p><section class="grid" id="streamSlots"></section></main><script>
(()=>{'use strict';const KEY='parrothit-sports-streams-v1';const SLOTS=[['football-feature','Football — Featured Stream'],['football-category','Football — Category Stream'],['sports-football-feature','Sports Football — Featured Stream'],['sports-football-category','Sports Football — Category Stream'],['table-tennis','Table Tennis Stream'],['basketball','Basketball Stream'],['tennis','Tennis Stream'],['athletics','Athletics Stream']];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){}function embedUrl(raw){const value=String(raw||'').trim();if(!value)return '';try{const u=new URL(value);if(!['https:','http:'].includes(u.protocol))return '';let id='';if(u.hostname==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';else if(/(^|\.)youtube\.com$/i.test(u.hostname)||/youtube-nocookie\.com$/i.test(u.hostname)){id=u.pathname==='/watch'?(u.searchParams.get('v')||''):(/^\/(?:embed|shorts|live)\//.test(u.pathname)?u.pathname.split('/')[2]:'')}if(id&&/^[A-Za-z0-9_-]{6,20}$/.test(id))return 'https://www.youtube-nocookie.com/embed/'+id;if(/(^|\.)vimeo\.com$/i.test(u.hostname)){const v=u.pathname.match(/\/(?:video\/)?(\d+)/);if(v)return 'https://player.vimeo.com/video/'+v[1]}if(['youtube.com','www.youtube.com','youtu.be','vimeo.com','www.vimeo.com'].includes(u.hostname))return '';return u.href}catch(_){return ''}}function render(){ $('streamSlots').innerHTML=SLOTS.map(([id,label],i)=>{const r=records[id]||{};return `<article class="slot" data-slot="${id}"><h2>${i+1}. ${label}</h2><label for="title-${id}">Public stream title</label><input id="title-${id}" maxlength="120" value="${esc(r.title||label)}" placeholder="${esc(label)}"><label for="url-${id}">YouTube, Vimeo or HTTPS embed URL</label><input id="url-${id}" inputmode="url" maxlength="1000" value="${esc(r.url||'')}" placeholder="https://www.youtube.com/watch?v=…"><label for="enabled-${id}">Slot visibility</label><select id="enabled-${id}"><option value="true" ${r.enabled&&r.url?'selected':''}>Enabled when a URL is present</option><option value="false" ${r.enabled===false||!r.url?'selected':''}>Disabled / hidden</option></select><p class="hint">Slot key: <code>${id}</code>. Save and disable buttons only affect this slot.</p><div class="actions"><button type="button" data-save="${id}">Save this slot</button><button type="button" class="secondary" data-disable="${id}">Disable this slot</button></div><p class="status" id="status-${id}" role="status">${r.url?'Saved configuration loaded.':'Not configured; hidden from visitors.'}</p></article>`}).join('')}
async function remoteSave(){const c=window.PARROTHIT_ADMIN_CLIENT||(window.getParrothitSupabaseClient?window.getParrothitSupabaseClient():null);if(!c)return false;const got=await c.from('site_settings').select('value').eq('key','sports_streams').maybeSingle();if(got.error)throw got.error;const merged={...(got.data&&got.data.value&&typeof got.data.value==='object'?got.data.value:{}),...records};const saved=await c.from('site_settings').upsert({key:'sports_streams',value:merged,updated_at:new Date().toISOString()},{onConflict:'key'});if(saved.error)throw saved.error;return true}
function persistLocal(){localStorage.setItem(KEY,JSON.stringify(records))}async function save(id,disable=false){const card=document.querySelector(`[data-slot="${id}"]`),status=$('status-'+id);const rawUrl=$('url-'+id).value.trim();if(disable){records[id]={...(records[id]||{}),title:$('title-'+id).value.trim()||id,url:'',enabled:false,updatedAt:new Date().toISOString()};$('url-'+id).value='';$('enabled-'+id).value='false'}else{const parsed=rawUrl?embedUrl(rawUrl):'';if(rawUrl&&!parsed){status.textContent='Enter a valid YouTube, Vimeo, or HTTPS embed URL.';return}records[id]={title:$('title-'+id).value.trim()||id,url:rawUrl?parsed:'',enabled:$('enabled-'+id).value==='true'&&!!parsed,updatedAt:new Date().toISOString()}}try{persistLocal();let shared=false;try{shared=await remoteSave()}catch(err){console.error('Stream settings publish failed',err)}status.textContent=shared?'Saved to this browser and published to the public website.':(records[id].url?'Saved in this browser. Configure Supabase admin access to publish across devices.':'Slot disabled and hidden; saved in this browser.');$('globalStatus').textContent=shared?'Stream slot saved and published.':'Local save completed. If the site uses Supabase, configure the public sports_streams policy to share changes.'}catch(err){status.textContent='Could not save: '+(err.message||'browser storage issue')}}
async function loadRemote(){const c=window.getParrothitSupabaseClient?window.getParrothitSupabaseClient():null;if(!c)return;try{const {data,error}=await c.from('site_settings').select('value').eq('key','sports_streams').maybeSingle();if(!error&&data&&data.value&&typeof data.value==='object'){records={...data.value,...records};persistLocal();render();$('globalStatus').textContent='Loaded saved stream settings. Browser-local values take priority on this device.'}}catch(_){}}
document.addEventListener('click',e=>{const saveBtn=e.target.closest('[data-save]'),offBtn=e.target.closest('[data-disable]');if(saveBtn)save(saveBtn.dataset.save,false);if(offBtn)save(offBtn.dataset.disable,true)});render();loadRemote();})();
</script><script src="../js/admin-commit-warning-fallback.js"></script></body></html>
