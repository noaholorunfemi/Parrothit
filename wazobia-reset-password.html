<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Wazobia password | PARROTHIT</title><link rel="stylesheet" href="css/wazobia-trends.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="/js/public-notifications.js?v=20261118-wazobia-shortcut-removal-v1" defer></script><style>body{display:grid;place-items:center;padding:20px}.wz-reset{width:min(100%,460px);background:var(--wz-card);border:1px solid var(--wz-border);border-radius:17px;padding:24px;box-shadow:var(--wz-shadow)}.wz-reset h1{font-size:22px;margin:0 0 8px}.wz-reset p{font-size:13px;line-height:1.5;color:var(--wz-muted)}.wz-reset button{margin-top:8px}.wz-reset a{display:inline-block;margin-top:14px;color:var(--wz-green);font-weight:800;text-decoration:none}</style></head><body class="wz-page"><main class="wz-reset"><div class="wz-auth-brand"><span class="wz-brand-mark">P</span><div><strong>PARROTHIT Wazobia Trends</strong><small>Account security</small></div></div><h1>Choose a new password</h1><p>Enter a new password for your Wazobia account. Use at least 8 characters.</p><form id="wz-reset-form"><label class="wz-field">New password<input id="wz-reset-password" type="password" minlength="8" required autocomplete="new-password"></label><label class="wz-field">Confirm password<input id="wz-reset-confirm" type="password" minlength="8" required autocomplete="new-password"></label><button class="wz-primary-btn" type="submit">Update password</button></form><p id="wz-reset-message" class="wz-auth-status" role="status"></p><a href="wazobia-trends.html">← Back to Wazobia Trends</a></main><script>document.getElementById('wz-reset-form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('wz-reset-message');const password=document.getElementById('wz-reset-password').value;if(password.length<8){out.textContent='Use at least 8 characters.';out.classList.add('error');return}if(password!==document.getElementById('wz-reset-confirm').value){out.textContent='The passwords do not match.';out.classList.add('error');return}const db=window.getParrothitSupabaseClient?.();if(!db){out.textContent='Supabase is not configured.';out.classList.add('error');return}const {error}=await db.auth.updateUser({password});out.textContent=error?error.message:'Password updated. Return to Wazobia Trends and log in.';out.classList.toggle('error',!!error)})</script></body></html>
