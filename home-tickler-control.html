<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homepage Tickler Control | PARROTHIT</title>
<script>document.documentElement.classList.add('admin-auth-pending');</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../js/local-preview.js"></script><script src="../js/admin-auth-guard.js"></script>
<style>body{margin:0;background:#f8fafc;color:#102c1b;font:16px/1.5 system-ui,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #d5e5d9;border-radius:14px;padding:18px;box-shadow:0 8px 26px #1232}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b8c9bd;border-radius:8px;font:inherit;color:#102c1b;background:#fff}textarea{min-height:110px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#166534;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.muted{color:#5d6e62;font-size:14px}.preview{margin-top:18px;padding:14px;border:1px solid #bfe7cb;border-radius:10px;background:#f4fff7;font-weight:800;animation:colors 7s linear infinite}@keyframes colors{0%,100%{color:#126b3a}25%{color:#1457a6}50%{color:#9a3412}75%{color:#7e22ce}}.admin-auth-pending body{visibility:hidden}</style>
<link rel="stylesheet" href="../css/admin-responsive.css?v=parrothit-v6"></head>
<body class="admin-auth-pending"><nav class="actions" style="padding:12px"><a class="btn" href="dashboard.html">Control Room</a><a class="btn" href="control-directory.html">All Controls</a><a class="btn" href="../index.html">View website</a></nav><main class="wrap"><h1>Homepage Tickler Text Control</h1><p class="muted">Edit the 30-word homepage message, enable or hide it, and publish it to the shared website when Supabase is configured.</p><section class="panel"><form id="tickerForm"><label for="tickerText">Tickler message (30 words recommended; maximum 300 characters)</label><textarea id="tickerText" maxlength="300" required></textarea><p class="muted" id="wordCount">0 words</p><label for="tickerEnabled">Visibility</label><select id="tickerEnabled"><option value="true">Visible on homepage</option><option value="false">Hidden</option></select><div class="actions"><button class="btn" type="submit">Save and publish</button><button class="btn" type="button" id="restore">Restore default</button></div></form><div class="preview" id="preview"></div><p class="muted" id="status" role="status" aria-live="polite">Loading settings…</p></section></main>
<script>
(()=>{'use strict';const DEFAULT='PARROTHIT brings you verified headlines, responsible reporting, and timely updates from Nigeria and around the world. Read sources, share responsibly, and stay informed with news that speaks every day today.';const $=id=>document.getElementById(id);const LOCALKEY='parrothit_control_room_v2';let client=null;let cfg={text:DEFAULT,enabled:true};function words(s){return (s.trim().match(/\S+/g)||[]).length}function paint(){$('preview').textContent=$('tickerText').value;$('wordCount').textContent=words($('tickerText').value)+' words';}function fill(){$('tickerText').value=cfg.text||DEFAULT;$('tickerEnabled').value=String(cfg.enabled!==false);paint()}$('tickerText').addEventListener('input',paint);$('tickerEnabled').addEventListener('change',paint);$('restore').addEventListener('click',()=>{cfg={text:DEFAULT,enabled:true};fill();$('status').textContent='Default loaded. Save and publish to apply.'});$('tickerForm').addEventListener('submit',async e=>{e.preventDefault();cfg={text:$('tickerText').value.trim(),enabled:$('tickerEnabled').value==='true',updatedAt:new Date().toISOString()};try{let state={};try{state=JSON.parse(localStorage.getItem(LOCALKEY)||'{}')}catch(_){}state.settings=state.settings||{};state.settings.homeTickler=cfg;localStorage.setItem(LOCALKEY,JSON.stringify(state));localStorage.setItem('parrothit-home-tickler-v1',JSON.stringify(cfg));if(client){const {error}=await client.from('site_settings').upsert({key:'home_tickler',value:cfg,updated_at:new Date().toISOString()},{onConflict:'key'});if(error)throw error;$('status').textContent='Saved locally and published to shared site settings. Refresh the homepage to see it.';}else $('status').textContent='Saved in this browser preview only. Configure Supabase and sign in to publish to all visitors.';}catch(err){$('status').textContent='Saved locally; shared publishing failed: '+(err.message||'Check Supabase settings and permissions.')}});
(async()=>{try{const local=JSON.parse(localStorage.getItem('parrothit-home-tickler-v1')||'null');if(local)cfg={...cfg,...local};else{const state=JSON.parse(localStorage.getItem(LOCALKEY)||'{}');cfg={...cfg,...((state.settings||{}).homeTickler||{})}}if(!window.PARROTHIT_LOCAL_PREVIEW&&window.supabase&&window.PARROTHIT_SUPABASE_URL&&window.PARROTHIT_SUPABASE_ANON_KEY&&!String(window.PARROTHIT_SUPABASE_URL).includes('YOUR-PROJECT')&&!String(window.PARROTHIT_SUPABASE_ANON_KEY).includes('YOUR_PUBLIC')){client=window.getParrothitSupabaseClient();const ses=await client.auth.getSession();if(ses.data&&ses.data.session){const profile=await client.from('admin_profiles').select('role').eq('user_id',ses.data.session.user.id).maybeSingle();if(profile.data&&['owner','admin'].includes(profile.data.role)){const remote=await client.from('site_settings').select('value').eq('key','home_tickler').maybeSingle();if(!remote.error&&remote.data&&remote.data.value)cfg={...cfg,...remote.data.value};window.PARROTHIT_ADMIN_CLIENT=client;}else client=null;}else client=null;}fill();$('status').textContent=client?'Connected to shared settings.':'Local preview mode; shared publish requires an authenticated admin and Supabase.';}catch(e){fill();$('status').textContent='Loaded local settings. '+(e.message||'');}finally{document.documentElement.classList.remove('admin-auth-pending');document.body.classList.remove('admin-auth-pending')}})();})();
</script></body></html>
