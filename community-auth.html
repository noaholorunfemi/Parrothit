<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join PARROTHIT Interaction</title><link rel="stylesheet" href="css/style.css"><style>
body{margin:0;background:#eaf1fb;color:#15223a;font-family:system-ui,Arial,sans-serif}.auth-shell{max-width:520px;margin:6vh auto;padding:18px}.auth-card{background:white;border:1px solid #d8e4f5;border-radius:20px;padding:24px;box-shadow:0 12px 40px #18345a18}.brand{background:#0b1730;color:white;padding:18px;border-radius:14px;text-align:center}.brand h1{margin:0;font-size:1.35rem}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,.submit{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.tabs button{flex:1;background:#edf4ff;color:#123}.tabs button.active,.submit{background:#1769df;color:white}.field{display:grid;gap:6px;margin:12px 0}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.hidden{display:none!important}.note{color:#52647c;font-size:.9rem;line-height:1.5}.status{min-height:24px;font-weight:700}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.links a{color:#1769df;font-weight:700}
</style></head><body><main class="auth-shell"><div class="auth-card"><header class="brand"><h1>🦜 PARROTHIT INTERACTION</h1><p>Sign in to chat with friends</p></header><div class="tabs"><button id="loginTab" class="active" type="button">Log in</button><button id="signupTab" type="button">Create account</button></div><p id="knownUser" class="note">Already registered? Log in with your existing account. You do not need to sign up again.</p><form id="authForm"><div id="signupFields" class="hidden"><label class="field">Display name<input id="displayName" autocomplete="name"></label><label class="field">Username<input id="username" autocomplete="username" minlength="3" maxlength="24" placeholder="letters, numbers or underscore"></label></div><label class="field">Email address<input id="email" type="email" required autocomplete="email"></label><label class="field">Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><div id="confirmField" class="field hidden">Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></div><label id="rulesField" class="note hidden"><input id="rules" type="checkbox"> I agree to the PARROTHIT community rules.</label><button class="submit" id="submitBtn" type="submit">Log in</button></form><p class="status" id="status" role="status"></p><div class="links"><a href="interaction.html">← Back to Interaction</a><button type="button" id="forgotPasswordBtn" style="border:0;background:transparent;color:#1769df;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0">Forgot password?</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/community-global-controls.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let mode='login',client=window.getParrothitSupabaseClient?.();let allowSignup=true;function nextPage(){const q=new URLSearchParams(location.search).get('next')||'interaction.html';return ['interaction.html','private-chat.html'].includes(q)||/^rooms\/[a-z-]+\.html$/.test(q)?q:'interaction.html'}function say(t,bad=false){$('status').textContent=t;$('status').style.color=bad?'#b91c1c':'#16703b'}function setMode(m){if(m==='signup'&&!allowSignup){say('New registrations are currently disabled by the PARROTHIT administrator.',true);m='login';}mode=m;const reg=m==='signup';$('signupFields').classList.toggle('hidden',!reg);$('confirmField').classList.toggle('hidden',!reg);$('rulesField').classList.toggle('hidden',!reg);$('displayName').required=reg;$('username').required=reg;$('confirmPassword').required=reg;$('rules').required=reg;$('loginTab').classList.toggle('active',!reg);$('signupTab').classList.toggle('active',reg);$('submitBtn').textContent=reg?'Create account':'Log in';$('password').autocomplete=reg?'new-password':'current-password';}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
(async()=>{if(!client){say('Supabase is not configured. Check supabase-config.js.',true);return}try{const cfg=await client.from('community_interaction_settings').select('allow_new_registrations,interaction_enabled,private_chat_enabled').eq('id',1).maybeSingle();if(!cfg.error&&cfg.data){allowSignup=cfg.data.allow_new_registrations!==false;$('signupTab').disabled=!allowSignup;$('signupTab').title=allowSignup?'Create a new account':'New registrations are disabled';if(!cfg.data.interaction_enabled)say('PARROTHIT Interaction activity is temporarily paused. Existing members can still log in.');if(nextPage()==='private-chat.html'&&cfg.data.private_chat_enabled===false)say('Private chat is paused by the administrator. You can still log in to your account.',true);}}catch(_){}const {data}=await client.auth.getSession();if(data?.session?.user){location.replace(nextPage());return;}setMode('login');})();
$('forgotPasswordBtn').addEventListener('click',async()=>{if(!client)return say('Supabase is not configured.',true);const email=$('email').value.trim();if(!email)return say('Enter your account email address first.',true);try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:new URL('community-reset-password.html',location.href).href});if(error)throw error;say('If this email belongs to an account, a password recovery link has been sent. Check your inbox.');}catch(err){say(err.message||'Could not send a recovery email.',true);}});
$('authForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return say('Supabase is not configured.',true);const email=$('email').value.trim(),password=$('password').value;const btn=$('submitBtn');btn.disabled=true;try{if(mode==='login'){const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.user){const provider=data.user.app_metadata?.provider;const verified=!!(data.user.email_confirmed_at||data.user.confirmed_at||provider==='google');if(!verified){await client.auth.signOut();throw new Error('Please verify your email from the confirmation link before signing in.');}location.href=nextPage();}}else{if(!allowSignup)throw new Error('New registrations are currently disabled.');const display_name=$('displayName').value.trim(),username=$('username').value.trim().toLowerCase();if(!display_name)return say('Enter your display name.',true);if(!/^[a-z0-9_]{3,24}$/.test(username))return say('Username must be 3–24 letters, numbers or underscores.',true);if(password.length<8)return say('Use at least 8 characters for the password.',true);if(password!==$('confirmPassword').value)return say('Passwords do not match.',true);if(!$('rules').checked)return say('Please accept the community rules.',true);const check=await client.rpc('parrothit_username_available',{candidate:username});if(check.error)throw new Error('Username validation is not ready. Apply supabase/community-interaction.sql. '+check.error.message);if(check.data!==true)throw new Error('That username is unavailable. Choose another.');const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name,username,rules_accepted:true},emailRedirectTo:new URL('interaction.html',location.href).href}});if(error)throw error;if(data.session){location.href=nextPage();}else say('Account created. Check your email to verify it. After verification, log in here.');}}catch(err){say(err.message||'Authentication failed.',true)}finally{btn.disabled=false}});
})();
</script>
<script src="js/parrothit-card-watermark.js" defer></script>
</body></html>
