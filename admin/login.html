<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Secure admin sign-in | PARROTHIT</title>

  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
</head>

<body>
  <div class="back-home-wrap">
    <a class="back-home-link" href="../index.html">← Back home</a>
  </div>

  <div class="admin-shell">
    <div class="admin-header">
      <h1>PARROTHIT ADMIN</h1>
      <a href="../index.html">← View website</a>
    </div>

    <section class="admin-panel" style="max-width:520px;margin:30px auto">
      <h2>Administrator sign in</h2>
      <p>Sign in using your administrator username or email and password.</p>

      <form id="loginForm" class="admin-form">
        <label>
          Username or email
          <input id="loginName" autocomplete="username" required>
        </label>

        <label>
          Password
          <input id="loginPassword" type="password"
                 autocomplete="current-password" required>
        </label>

        <button class="admin-btn" type="submit">Sign in securely</button>
      </form>

      <p><a href="forgot-password.html">Forgot your password?</a></p>
      <p id="loginMessage" role="status"></p>

      <p class="meta">
        Supabase configuration is loaded from supabase-config.js.
        Never use a service-role or secret key in browser code.
      </p>
    </section>
  </div>

  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const msg = document.getElementById('loginMessage');
      msg.textContent = '';

      if (
        !window.supabase ||
        !window.PARROTHIT_SUPABASE_URL ||
        !window.PARROTHIT_SUPABASE_ANON_KEY
      ) {
        msg.textContent =
          'Supabase configuration is missing. Check supabase-config.js.';
        return;
      }

      try {
        const client = window.supabase.createClient(
          window.PARROTHIT_SUPABASE_URL,
          window.PARROTHIT_SUPABASE_ANON_KEY
        );

        const login = document.getElementById('loginName').value.trim();
        let email = login;

        if (!login.includes('@')) {
          const { data, error } = await client.rpc(
            'resolve_admin_email',
            { p_username: login }
          );

          if (error || !data) {
            throw new Error(
              'Username lookup failed. Try your administrator email or check the Supabase setup.'
            );
          }

          email = data;
        }

        const { error } = await client.auth.signInWithPassword({
          email,
          password: document.getElementById('loginPassword').value
        });

        if (error) throw error;

        window.location.href = 'dashboard.html';

      } catch (err) {
        msg.textContent = err.message || 'Unable to sign in.';
      }
    });
  </script>
</body>
</html>
