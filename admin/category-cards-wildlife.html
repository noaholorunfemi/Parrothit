<script>
const KEY="parrothit-category-cards-v1-wildlife";const CATEGORY="wildlife";let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){records={}}
const files={};
function defaultCategoryDestination(i){return 'article.html?categoryCard='+encodeURIComponent(CATEGORY+'-'+i)}

async function preview(i,src){const im=document.getElementById('preview'+i);if(!src){im.removeAttribute('src');im.hidden=true;return}try{const resolved=window.PARROTHITMediaStore?await window.PARROTHITMediaStore.resolve(src):src;if(resolved){im.src=resolved;im.hidden=false}else{im.removeAttribute('src');im.hidden=true}}catch(e){im.hidden=true}}
function loadCard(i){const r=records[i]||{};document.getElementById('title'+i).value=r.title||'';document.getElementById('text'+i).value=r.text||'';document.getElementById('url'+i).value=r.imageUrl||'';document.getElementById('target'+i).value=r.targetUrl||defaultCategoryDestination(i);document.getElementById('enabled'+i).checked=r.enabled!==false;preview(i,r.image||r.imageUrl||'')}
for(let i=1;i<=6;i++){loadCard(i);const targetField=document.getElementById('target'+i);if(targetField&&!document.getElementById('reset-destination-'+i)){const reset=document.createElement('button');reset.type='button';reset.id='reset-destination-'+i;reset.className='btn';reset.textContent='Restore default destination';reset.style.marginTop='6px';reset.addEventListener('click',()=>{targetField.value=defaultCategoryDestination(i);document.getElementById('status').textContent='Default destination restored for card '+i+'. Save the card to apply it.'});targetField.insertAdjacentElement('afterend',reset)}document.getElementById('file'+i).addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){window.PARROTHITAdminNotice('Please choose an image file.');e.target.value='';return}if(f.size>100*1024*1024){window.PARROTHITAdminNotice('Choose an image of 100 MB or less.');e.target.value='';return}try{files[i]=await window.PARROTHITMediaStore.store(f);await preview(i,files[i]);document.getElementById('status').textContent='Image stored in IndexedDB for card '+i+'.'}catch(err){document.getElementById('status').textContent=err.message||'Could not store image.';e.target.value=''}});document.getElementById('url'+i).addEventListener('input',()=>{if(!files[i])preview(i,document.getElementById('url'+i).value.trim())})}
if(window.PARROTHITCategoryCardPublisher){window.PARROTHITCategoryCardPublisher.load(CATEGORY).then(remote=>{if(remote&&typeof remote==='object'){records={...records,...remote};try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){}for(let n=1;n<=6;n++)loadCard(n);}}).catch(err=>{const st=document.getElementById('status');if(st)st.textContent='Could not load shared category cards: '+(err.message||'Check Supabase permissions.');});}
async function saveCard(i){const title=document.getElementById('title'+i).value.trim(),text=document.getElementById('text'+i).value.trim(),imageUrl=document.getElementById('url'+i).value.trim();const old=records[i]||{};const targetUrl=document.getElementById('target'+i).value.trim()||defaultCategoryDestination(i);if(!/^(https?:\/\/|\/|\.\.?\/|[a-z0-9_-]+\.html(?:[?#]|$))/i.test(targetUrl)){document.getElementById('status').textContent='Card '+i+': enter a valid http(s) URL or local page path.';return}records[i]={title,text,image:files[i]||old.image||'',imageUrl,targetUrl,enabled:document.getElementById('enabled'+i).checked,updatedAt:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(records));if(window.PARROTHITCategoryCardPublisher){const result=await window.PARROTHITCategoryCardPublisher.save(CATEGORY,records);document.getElementById('status').textContent='Card '+i+' '+result.message}else document.getElementById('status').textContent='Card '+i+' saved in this browser only.'}catch(e){document.getElementById('status').textContent='Saved locally, but shared publishing failed: '+(e.message||'Check Supabase permissions.')}} 
async function clearCard(i){if(!CATEGORY){document.getElementById('status').textContent='Open this page with ?category=your-category-slug before clearing cards.';return}if(!confirm('Delete content for card '+i+'?'))return;delete records[i];delete files[i];let syncMessage='';try{localStorage.setItem(KEY,JSON.stringify(records));if(window.PARROTHITCategoryCardPublisher){const result=await window.PARROTHITCategoryCardPublisher.save(CATEGORY,records);syncMessage=result.message||''}}catch(e){syncMessage='Shared publishing failed: '+(e.message||'Check Supabase permissions.')}document.getElementById('title'+i).value='';document.getElementById('text'+i).value='';document.getElementById('url'+i).value='';document.getElementById('target'+i).value=defaultCategoryDestination(i);document.getElementById('file'+i).value='';document.getElementById('enabled'+i).checked=false;preview(i,'');document.getElementById('status').textContent='Card '+i+' cleared. '+syncMessage}
</script>

(()=>{

function isAction(el){if(!el||el.closest(SKIP_SELECTOR))return false;const txt=actionText(el).replace(/\s+/g,' ').trim().toLowerCase();return el.id==='parrothit-admin-commit-button'||/^commit changes?$/.test(txt)||el.hasAttribute('data-commit-change');}

document.addEventListener('click',async e=>{
 const el=e.target.closest('button,input[type="submit"],input[type="button"],input[type="file"],[role="button"],a[data-confirm-action]');if(!el)return;

 const oldConfirm=window.confirm;window.confirm=()=>true;
 try{el.click()}catch(err){console.error('PARROTHIT action failed:',err)}finally{window.confirm=oldConfirm;setTimeout(()=>{if(bypassClick===el)bypassClick=null;if(bypassSubmit===form)bypassSubmit=null},0)}
},true);
document.addEventListener('submit',async e=>{

 if(bypassSubmit===form){bypassSubmit=null;return}
 const submitter=e.submitter;const submitLabel=submitter?actionText(submitter).replace(/\s+/g,' ').trim().toLowerCase():'';if(!(submitter&&(submitter.id==='parrothit-admin-commit-button'||/^commit changes?$/.test(submitLabel)||submitter.hasAttribute('data-commit-change'))))return;const label=actionText(submitter)||'Commit Change';
 e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
 const ok=await ask(`Parrot Warning! You are about to ${String(label).trim().toLowerCase()}. Do you want to revoke this action or continue?`);if(!ok)return;

},true);

 const style=document.createElement('style');style.textContent=`#parrothit-admin-commit-bar{position:sticky;top:0;z-index:99990;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;margin:8px 0;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;color:#0f172a}#parrothit-admin-commit-bar button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;background:#166534;color:white}#parrothit-admin-commit-bar button:disabled{opacity:.55;cursor:not-allowed}#parrothit-admin-commit-status{font-size:13px;color:#334155}#parrothit-admin-toast-stack{position:fixed;right:12px;bottom:12px;z-index:100000;display:grid;gap:8px;max-width:min(92vw,380px)}.parrothit-admin-toast{background:#0f172a;color:#fff;padding:11px 14px;border-radius:9px;box-shadow:0 5px 20px #0002;font:14px/1.4 system-ui,sans-serif}`;document.head.appendChild(style);
 let stack=document.createElement('div');stack.id='parrothit-admin-toast-stack';stack.setAttribute('aria-live','polite');document.body.appendChild(stack);
 window.PARROTHITAdminNotice=(message)=>{const t=document.createElement('div');t.className='parrothit-admin-toast';t.textContent=String(message??'');stack.appendChild(t);setTimeout(()=>t.remove(),4500);};
 // Replace browser alert pop-ups with quiet, non-blocking in-page notices.
 window.alert=window.PARROTHITAdminNotice;
 const path=location.pathname.toLowerCase();if(/\/(login|signup|forgot-password|reset-password)\.html$/.test(path))return;
 const bar=document.createElement('div');bar.id='parrothit-admin-commit-bar';bar.innerHTML='<strong>Admin actions</strong><span id="parrothit-admin-commit-status">Edit a section, then commit its changes here.</span><button type="button" id="parrothit-admin-commit-button">Commit Changes</button>';
 const firstMain=document.querySelector('main');if(firstMain)firstMain.parentNode.insertBefore(bar,firstMain);else document.body.insertBefore(bar,document.body.firstChild);
 let activeForm=null,activeSaveButton=null;
 const isSaveButton=(el)=>el&&el.matches&&el.matches('button,input[type="submit"]')&&/save|publish|update|commit|apply|upload|add|create|restore|import|delete|remove|reset|clear|enable|disable|feature|approve|suspend/i.test((el.innerText||el.value||el.getAttribute('aria-label')||''));
 document.addEventListener('focusin',e=>{const f=e.target&&e.target.closest&&e.target.closest('form');if(f)activeForm=f;});
 document.addEventListener('input',e=>{const f=e.target&&e.target.closest&&e.target.closest('form');if(f)activeForm=f;});
 document.addEventListener('change',e=>{const f=e.target&&e.target.closest&&e.target.closest('form');if(f)activeForm=f;});
 document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('button,input[type="submit"]');if(b&&b.id!=='parrothit-admin-commit-button'&&isSaveButton(b)){activeSaveButton=b;const f=b.form||b.closest('form');if(f)activeForm=f;}});
 const status=bar.querySelector('#parrothit-admin-commit-status'),commit=bar.querySelector('#parrothit-admin-commit-button');
 commit.addEventListener('click',()=>{
   if(activeForm&&activeForm.isConnected){
     const submit=activeForm.querySelector('button[type="submit"],input[type="submit"]');
     if(submit){submit.click();status.textContent='Commit requested for the active section.';return;}
     if(typeof activeForm.requestSubmit==='function'){activeForm.requestSubmit();status.textContent='Commit requested for the active section.';return;}
   }
   if(activeSaveButton&&activeSaveButton.isConnected){activeSaveButton.click();status.textContent='Action submitted.';return;}
   status.textContent='Select or edit a section first, or use that section’s Save button.';
 });
})();
</script>
</body></html>
