<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARROTHIT Campaign Allocation Manager</title><link rel="stylesheet" href="../css/style.css">
<style>body{font-family:Arial,sans-serif;background:#eef2f5;color:#132033;margin:0}.wrap{max-width:1180px;margin:auto;padding:22px}.panel{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.slot{border:1px solid #d7e0e8;border-radius:12px;padding:14px}.slot h3{margin:0 0 8px}.slot code{overflow-wrap:anywhere}.btn{background:#075b43;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.muted{color:#667085}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 12px}@media(max-width:600px){.wrap{padding:12px}.panel{padding:14px}}</style></head><body><main class="wrap">
<h1>Campaign Allocation Manager</h1><p class="muted">Choose a paid campaign, then select one of the three advertising cards on any supported page.</p>
<section class="panel"><label>Campaign / Advertiser</label><input id="campaign" placeholder="Enter paid campaign ID or advertiser name"><label>Search destination</label><input id="filter" placeholder="Filter by page (e.g. business.html)"><p id="count" class="muted"></p></section>
<section class="panel"><h2>Available advertising destinations</h2><div id="slots" class="grid"></div></section>
<script>
(async()=>{const response=await fetch('../campaign-ad-destinations.json');const data=await response.json();const root=document.getElementById('slots'),filter=document.getElementById('filter'),count=document.getElementById('count');
function render(){const q=filter.value.toLowerCase();const list=data.destinations.filter(x=>(x.page+' '+x.label).toLowerCase().includes(q));count.textContent=list.length+' destinations • 3 cards per listed page';root.innerHTML=list.map(x=>`<article class="slot"><h3>${x.page} — Ads Card ${x.slot}</h3><p><code>${x.url}</code></p><button class="btn" data-id="${x.id}">Select destination</button></article>`).join('');root.querySelectorAll('button').forEach(b=>b.onclick=()=>{const campaign=document.getElementById('campaign').value.trim();if(!campaign){alert('Enter the paid campaign ID or advertiser name first.');return;}const dest=data.destinations.find(x=>x.id===b.dataset.id);const payload={campaign,destination:dest.id,page:dest.page,slot:dest.slot,url:dest.url};alert('Destination selected.\n\n'+JSON.stringify(payload,null,2)+'\n\nConnect this selection to the campaign allocation database to save it.');});}
filter.addEventListener('input',render);render();})();
</script></main><script src="/js/public-notifications.js?v=20261112-read-article-only-v1"></script>
</body></html>
