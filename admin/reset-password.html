<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set new password | PARROTHIT</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.example.js"></script></head><body>
<div class="back-home-wrap"><a class="back-home-link" href="../index.html">← Back home</a></div>
<div class="admin-shell"><section class="admin-panel" style="max-width:520px;margin:30px auto"><h1>Set a new password</h1><form id="newPasswordForm" class="admin-form"><label>New password<input id="newPassword" type="password" minlength="10" required autocomplete="new-password"></label><button class="admin-btn">Update password</button></form><p id="message" role="status"></p></section></div><script>document.getElementById('newPasswordForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');if(!window.supabase||!window.PARROTHIT_SUPABASE_URL||window.PARROTHIT_SUPABASE_URL.includes('YOUR-PROJECT')){m.textContent='Supabase setup is required first.';return;}const c=window.supabase.createClient(window.PARROTHIT_SUPABASE_URL,window.PARROTHIT_SUPABASE_ANON_KEY);const {error}=await c.auth.updateUser({password:document.getElementById('newPassword').value});m.textContent=error?error.message:'Password updated. You can now sign in.';});</script></body></html>
