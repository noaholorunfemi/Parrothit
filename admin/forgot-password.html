<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover password | PARROTHIT</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.example.js"></script></head><body>
<div class="back-home-wrap"><a class="back-home-link" href="../index.html">← Back home</a></div>
<div class="admin-shell"><div class="admin-header"><h1>PARROTHIT ADMIN</h1><a href="login.html">← Sign in</a></div><section class="admin-panel" style="max-width:520px;margin:30px auto"><h2>Recover forgotten password</h2><p>Enter the email address linked to your administrator account. Supabase will email a secure reset link.</p><form id="resetForm" class="admin-form"><label>Administrator email<input id="resetEmail" type="email" autocomplete="email" required></label><button class="admin-btn">Send reset link</button></form><p id="resetMessage" role="status"></p></section></div><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('resetMessage');if(!window.supabase||!window.PARROTHIT_SUPABASE_URL||window.PARROTHIT_SUPABASE_URL.includes('YOUR-PROJECT')){msg.textContent='Supabase setup is required first.';return;}try{const c=window.supabase.createClient(window.PARROTHIT_SUPABASE_URL,window.PARROTHIT_SUPABASE_ANON_KEY);const {error}=await c.auth.resetPasswordForEmail(document.getElementById('resetEmail').value,{redirectTo:location.origin+location.pathname.replace('forgot-password.html','reset-password.html')});if(error)throw error;msg.textContent='If the account exists, a password reset email has been sent.';}catch(err){msg.textContent=err.message||'Unable to request password reset.';}});</script></body></html>
