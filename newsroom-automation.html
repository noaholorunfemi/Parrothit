<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARROTHIT Newsroom</title><style>body{font-family:Arial,sans-serif;background:#071b13;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}main{padding:24px;text-align:center}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><main><p>Checking administrator access…</p></main><script>
(async function(){
  try {
    if (!window.getParrothitSupabaseClient || !window.PARROTHIT_SUPABASE_URL || !window.PARROTHIT_SUPABASE_ANON_KEY) { location.replace('index.html'); return; }
    const client = window.getParrothitSupabaseClient();
    const {data, error} = await client.auth.getSession();
    const session = data && data.session;
    if (error || !session) { location.replace('login.html?next=admin%2Fnewsroom-automation.html'); return; }
    const {data: profile, error: profileError} = await client.from('admin_profiles').select('role,is_suspended').eq('user_id', session.user.id).maybeSingle();
    if (profileError || !profile || profile.is_suspended || !['owner','admin'].includes(profile.role)) { location.replace('index.html'); return; }
    location.replace('admin/newsroom-automation.html');
  } catch (_) { location.replace('index.html'); }
})();
</script></body></html>
