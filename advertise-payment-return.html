<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | PARROTHIT</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:linear-gradient(135deg,#edf7ef 0%,#fff 52%,#fff0f0 100%);color:#172033;font-family:Arial,sans-serif}.box{max-width:620px;margin:8vh auto;padding:25px;background:#fff;border:1px solid #dce6de;border-radius:16px;box-shadow:0 8px 30px #10251a12}.mark{display:inline-block;padding:6px 11px;border-radius:30px;background:#14532d;color:#fff;font-weight:bold}.box h1{color:#14532d}.state{padding:14px;border-radius:9px;background:#eef2f7;line-height:1.6}.success{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.muted{color:#64748b;line-height:1.6}a.btn{display:inline-block;background:#14532d;color:#fff!important;text-decoration:none;border-radius:8px;padding:11px 15px;font-weight:bold}</style><script src="js/work-with-parrothit-footer.js" defer></script>
</head><body><main class="box"><span class="mark">PARROTHIT · SECURE PAYMENT</span><h1>Checking your payment</h1><p class="muted">Please keep this page open while PARROTHIT confirms the transaction directly with the payment provider.</p><div id="state" class="state" role="status">Connecting to payment verification…</div><p id="reference" class="muted"></p><p><a class="btn" href="advertisement-status.html">Open advertiser dashboard</a> <a class="btn" href="index.html" style="background:#d71920">Return to PARROTHIT</a></p></main>
<script src="supabase-config.js"></script><script>
(async function(){const state=document.getElementById('state'),refBox=document.getElementById('reference'),q=new URLSearchParams(location.search);const provider=(q.get('provider')||'').toLowerCase();const reference=q.get('reference')||q.get('tx_ref')||'';const transactionId=q.get('transaction_id')||'';const returnStatus=(q.get('status')||'').toLowerCase();
function show(text,kind){state.textContent=text;state.className='state '+(kind||'')}
if(!['paystack','flutterwave'].includes(provider)||!reference){show('We could not identify this payment. Please contact PARROTHIT with your receipt/reference.', 'fail');return}
refBox.textContent='Payment reference: '+reference;
if(returnStatus==='cancelled'){show('The payment was cancelled. Your campaign has not been activated. You can return to PARROTHIT or contact the advertising team.', 'fail');return}
try{const url=window.PARROTHIT_SUPABASE_URL,key=window.PARROTHIT_SUPABASE_ANON_KEY;if(!url||!key)throw new Error('The payment verification service is not configured.');const response=await fetch(url+'/functions/v1/parrothit-monetization-payment',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({action:'verify',provider,reference,transaction_id:transactionId})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'Payment verification could not be completed.');if(result.paid)show(result.message||'Payment verified and recorded. Keep your payment receipt for your records.','success');else show(result.message||'The payment is not confirmed yet. Do not make another payment until you have checked with PARROTHIT. The campaign has not been activated.','');
}catch(e){show((e.message||'Verification failed.')+' Your payment may still be processing. Please share the reference with PARROTHIT; do not pay again until the status is checked.','fail')}
})();
</script><script src="js/parrothit-advertise-banner.js" defer></script>
<script src="/js/parrothit-ai-assistant.js?v=20261110-composer-drag-voice" defer></script>
</body></html>
