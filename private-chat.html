<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private chats | PARROTHIT</title><link rel="stylesheet" href="css/style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#17202a;font-family:Arial,system-ui,sans-serif}.chat-app{height:100dvh;max-width:1050px;margin:auto;background:#fff;display:grid;grid-template-columns:minmax(280px,38%) 1fr;box-shadow:0 0 25px #0001}.friends-pane{border-right:1px solid #e5e7eb;min-width:0;display:flex;flex-direction:column}.topbar{padding:15px 16px;background:#f7f7f7;display:flex;align-items:center;justify-content:space-between;font-weight:800}.search{padding:10px 14px;background:#fff}.search input{width:100%;border:0;border-radius:22px;background:#f1f3f5;padding:12px 16px;font:inherit;outline:none}.friend-list{overflow:auto}.friend{display:flex;gap:12px;align-items:center;width:100%;border:0;background:#fff;text-align:left;padding:13px 14px;cursor:pointer;border-bottom:1px solid #f5f5f5;color:inherit}.friend:hover,.friend.active{background:#f0f8f3}.avatar{width:50px;height:50px;border-radius:50%;background:#dce8e1;display:grid;place-items:center;font-size:1.2rem;font-weight:800;flex:0 0 50px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.friend-meta{min-width:0;flex:1}.friend-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:.88rem;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.date{font-size:.75rem;color:#6b7280;align-self:flex-start;white-space:nowrap}.chat-pane{min-width:0;display:flex;flex-direction:column;background:#efe9df;background-image:radial-gradient(#cbbda633 1px,transparent 1px);background-size:20px 20px}.chat-head{display:flex;gap:12px;align-items:center;background:#f8faf9;padding:12px 16px;border-bottom:1px solid #e5e7eb}.chat-head .friend-name{font-size:1.05rem}.chat-head small{display:block;margin-top:4px;color:#667085}.back{display:none;border:0;background:transparent;font-size:1.6rem}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.notice{align-self:center;max-width:95%;text-align:center;background:#fff3cf;color:#58616c;border-radius:10px;padding:10px 13px;font-size:.86rem;margin-bottom:8px}.bubble{max-width:min(82%,520px);padding:10px 13px;border-radius:12px;background:#fff;box-shadow:0 1px 1px #0001;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#d9fdd3}.bubble time{display:block;text-align:right;font-size:.7rem;color:#667085;margin-top:5px}.composer{display:flex;align-items:center;gap:8px;background:#f8faf9;padding:12px;border-top:1px solid #e5e7eb}.composer input{min-width:0;flex:1;border:1px solid #ddd;border-radius:25px;padding:13px 16px;font:inherit;background:#fff}.send{border:0;border-radius:50%;width:46px;height:46px;background:#19a463;color:#fff;font-size:1.2rem;cursor:pointer}.empty{margin:auto;text-align:center;color:#697586;padding:25px}.empty b{display:block;color:#253044;font-size:1.2rem;margin-bottom:8px}.muted{color:#6b7280;font-size:.9rem;padding:12px}.hidden{display:none!important}@media(max-width:650px){.chat-app{display:block;height:100dvh}.friends-pane,.chat-pane{height:100dvh;width:100%}.chat-pane{display:none}.chat-app.open-chat .friends-pane{display:none}.chat-app.open-chat .chat-pane{display:flex}.back{display:block}.topbar{padding:13px}.friend{padding:12px}.avatar{width:48px;height:48px;flex-basis:48px}}
</style></head><body><main class="chat-app" id="app"><aside class="friends-pane"><div class="topbar"><span>🦜 Private chats</span><a href="interaction.html" aria-label="Back to interaction">↗</a></div><div class="search"><input id="friendSearch" placeholder="Search friends or members" aria-label="Search friends or members"></div><div id="friendList" class="friend-list"><p class="muted">Loading friends…</p></div></aside><section class="chat-pane"><header class="chat-head"><button id="backBtn" class="back" aria-label="Back to friends">‹</button><div class="avatar" id="chatAvatar">👤</div><div class="friend-meta"><div class="friend-name" id="chatName">Choose a friend</div><small id="chatStatus">Your private conversations</small></div></header><div class="messages" id="messages"><div class="empty"><b>Private messages</b>Select a friend to open your conversation.</div></div><form class="composer" id="messageForm"><input id="messageInput" maxlength="4000" placeholder="Message" autocomplete="off" aria-label="Message" disabled><button class="send" type="submit" aria-label="Send message" disabled>➤</button></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/community-global-controls.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),app=$('app');let client=null,user=null,people=[],active=null,timer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const say=(t)=>{$('friendList').innerHTML='<p class="muted">'+esc(t)+'</p>'};function initials(p){return (p.display_name||p.username||'?').trim().slice(0,1).toUpperCase()}function avatar(p){return p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(initials(p))}function pair(a,b){return [a,b].sort().join(':')}function renderFriends(){const q=$('friendSearch').value.toLowerCase();const list=people.filter(p=>(p.display_name+' '+p.username).toLowerCase().includes(q));$('friendList').innerHTML=list.length?list.map(p=>`<button class="friend ${active?.user_id===p.user_id?'active':''}" data-id="${esc(p.user_id)}"><span class="avatar">${avatar(p)}</span><span class="friend-meta"><span class="friend-name">${esc(p.display_name||p.username||'Member')}</span><span class="preview">${esc(p.last_message||'Tap to start chatting')}</span></span><span class="date">${p.unread?'●':''}</span></button>`).join(''):'<p class="muted">No friends found. Add members using the Interaction page friend controls, then return here.</p>';document.querySelectorAll('.friend').forEach(b=>b.onclick=()=>openPerson(b.dataset.id))}async function init(){client=window.getParrothitSupabaseClient?.();if(!client)return say('Supabase is not configured.');const {data,error}=await client.auth.getSession();if(error||!data?.session?.user){location.replace('community-auth.html?next=private-chat.html');return}user=data.session.user;try{const flags=await client.from('community_interaction_settings').select('interaction_enabled,private_chat_enabled').eq('id',1).maybeSingle();if(!flags.error&&flags.data&&(flags.data.interaction_enabled===false||flags.data.private_chat_enabled===false)){say('Private chat is currently disabled by Admin 1. Return to PARROTHIT Interaction for updates.');$('messageInput').disabled=true;$('messageForm').querySelector('button').disabled=true;return;}}catch(_){}const {data:rels,error:re}=await client.from('community_friendships').select('requester_id,addressee_id,status').or(`requester_id.eq.${user.id},addressee_id.eq.${user.id}`).eq('status','accepted');if(re)return say('Could not load friends: '+re.message);const ids=[...new Set((rels||[]).map(r=>r.requester_id===user.id?r.addressee_id:r.requester_id))];if(!ids.length){people=[];renderFriends();return}const {data:profiles,error:pe}=await client.from('community_social_profiles').select('user_id,username,display_name,avatar_url').in('user_id',ids);if(pe)return say('Could not load member profiles: '+pe.message);people=(profiles||[]).filter(p=>p.user_id!==user.id);await refreshPreviews();renderFriends();const target=new URLSearchParams(location.search).get('to');if(target&&people.some(p=>p.user_id===target))openPerson(target);else if(people.length===1){}}
async function refreshPreviews(){for(const p of people){const {data}=await client.from('community_direct_messages').select('body,created_at,sender_id').or(`and(sender_id.eq.${user.id},recipient_id.eq.${p.user_id}),and(sender_id.eq.${p.user_id},recipient_id.eq.${user.id})`).order('created_at',{ascending:false}).limit(1);if(data?.[0])p.last_message=(data[0].sender_id===user.id?'You: ':'')+data[0].body;}}
async function openPerson(id){active=people.find(p=>p.user_id===id);if(!active)return;app.classList.add('open-chat');$('chatName').textContent=active.display_name||active.username||'Member';$('chatStatus').textContent='🔒 Private conversation';$('chatAvatar').innerHTML=avatar(active);$('messageInput').disabled=false;$('messageForm').querySelector('button').disabled=false;renderFriends();await loadMessages();if(timer)clearInterval(timer);timer=setInterval(loadMessages,5000);$('messageInput').focus()}
async function loadMessages(){if(!active)return;const {data,error}=await client.from('community_direct_messages').select('id,sender_id,recipient_id,body,created_at').or(`and(sender_id.eq.${user.id},recipient_id.eq.${active.user_id}),and(sender_id.eq.${active.user_id},recipient_id.eq.${user.id})`).order('created_at',{ascending:true}).limit(200);if(error){$('messages').innerHTML='<div class="empty">Private chat database is not ready. Run supabase/private-chat.sql in Supabase SQL Editor.</div>';return}const box=$('messages'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.innerHTML=(data||[]).length?(data||[]).map(m=>`<div class="bubble ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<time>${new Date(m.created_at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}${m.sender_id===user.id?' ✓✓':''}</time></div>`).join(''):'<div class="empty"><b>Start a conversation</b>Send a friendly message to '+esc(active.display_name||active.username)+'.</div>';if(atBottom)box.scrollTop=box.scrollHeight}
$('messageForm').addEventListener('submit',async e=>{e.preventDefault();if(!active||!user)return;const input=$('messageInput'),body=input.value.trim();if(!body)return;input.disabled=true;try{const {error}=await client.from('community_direct_messages').insert({sender_id:user.id,recipient_id:active.user_id,body});if(error)throw error;input.value='';await loadMessages();active.last_message='You: '+body;renderFriends()}catch(err){alert('Message could not be sent: '+err.message+'\nCheck that supabase/private-chat.sql has been applied.')}finally{input.disabled=false;input.focus()}});
$('friendSearch').addEventListener('input',renderFriends);$('backBtn').onclick=()=>{app.classList.remove('open-chat');if(timer)clearInterval(timer)};window.addEventListener('beforeunload',()=>timer&&clearInterval(timer));init();
})();
</script>
<script src="js/parrothit-card-watermark.js" defer></script>
</body></html>
